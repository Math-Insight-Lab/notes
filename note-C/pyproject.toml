[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "note-C"
version = "0.1.0"
description = "Level-C 高中数理直觉随笔"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/Math-Insight-Lab/note-C"
Repository = "https://github.com/Math-Insight-Lab/note-C"
